[package]
name = "rm_monitor"
version = "0.1.0"
edition = "2021"
description = "Standalone helpers for the Ubuntu taskbar Resource Monitor installer"
license = "MIT"
publish = false

[[bin]]
name = "rm-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps metadata.json / device-list key order byte-identical to
# the Python helpers this binary replaces.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"

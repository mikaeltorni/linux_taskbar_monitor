[package]
name = "rm_monitor"
version = "0.1.0"
edition = "2021"
description = "Standalone helpers for the Ubuntu taskbar Resource Monitor installer"
license = "MIT"
publish = false

[[bin]]
name = "rm-monitor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = "1"
# preserve_order keeps metadata.json / device-list key order stable for
# GSettings device-list serialization.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
